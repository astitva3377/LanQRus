services:
  server:
    build:
      context: .
      target: server
    environment:
      - SERVER_ADDR=0.0.0.0:9000
    networks:
      - noise-network
    stdin_open: true
    tty: true

  client:
    build:
      context: .
      target: client
    depends_on:
      - server
    environment:
      - SERVER_ADDR=server:9000
    networks:
      - noise-network
    stdin_open: true
    tty: true

networks:
  noise-network:
    driver: bridge
