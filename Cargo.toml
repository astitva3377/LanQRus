[package]
name = "lanqrus"
version = "0.1.0"
edition = "2024"

[dependencies]
hkdf = "0.13.0"
if-addrs = "0.15.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
snow = { version = "0.10.0", features = ["risky-raw-split"] }
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = [
	"rt-multi-thread",
	"macros",
	"io-util",
	"sync",
	"time",
	"net",
] }
zeroize = "1.9.2"
